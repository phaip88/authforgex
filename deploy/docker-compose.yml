# AuthForge — one-command production deployment.
#   docker compose -f deploy/docker-compose.yml up -d
# Set AF_JWT_SECRET in your environment first (openssl rand -hex 32).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authforge
      POSTGRES_PASSWORD: ${AF_DB_PASSWORD:?set AF_DB_PASSWORD}
      POSTGRES_DB: authforge
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authforge -d authforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: authforge:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://authforge:${AF_DB_PASSWORD}@db:5432/authforge
      AF_JWT_SECRET: ${AF_JWT_SECRET:?set AF_JWT_SECRET (openssl rand -hex 32)}
    ports:
      - "8080:3000"
    deploy:
      resources:
        limits:
          memory: 512M
    # Put a TLS-terminating reverse proxy (Caddy/nginx/Traefik) in front and
    # point it at :8080. HSTS is emitted by the app; TLS is still required for
    # real security.

volumes:
  db-data:
